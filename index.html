<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Heldora RP - Chargement</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02030c; font-family: 'Rajdhani', 'Segoe UI', sans-serif; color: #fff; }
  #bg { position: fixed; inset: 0; background: url('background.jpg') center / cover no-repeat; }
  #bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,10,.55) 100%); }

  /* Logo + nom en haut à gauche : apparait puis disparait */
  #brand { position: fixed; top: 40px; left: 60px; display: flex; align-items: center; gap: 18px; opacity: 0; transform: translateX(-20px); animation: brand 9s ease forwards; }
  #brand img { width: 64px; height: 64px; border-radius: 50%; filter: drop-shadow(0 0 14px rgba(40,100,255,.8)); }
  #brand span { font-size: 40px; font-weight: 700; letter-spacing: 5px; }
  #brand b { color: #2f6bff; }
  @keyframes brand {
    0%   { opacity: 0; transform: translateX(-20px); }
    10%  { opacity: 1; transform: translateX(0); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* Info en bas à gauche */
  #info { position: fixed; left: 60px; bottom: 56px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 500; text-shadow: 0 2px 8px #000; }
  #info em { font-style: normal; font-weight: 700; font-size: 15px; letter-spacing: 3px; padding: 4px 12px; border-radius: 5px; background: #c8202f; }
  #tip { transition: opacity .5s; }

  /* Barre de progression */
  #bar { position: fixed; left: 0; bottom: 0; height: 5px; width: 0; background: linear-gradient(90deg, #1c4bd8, #5b8dff); box-shadow: 0 0 14px #2f6bff; transition: width .4s; }
  #status { position: fixed; right: 60px; bottom: 56px; font-size: 18px; opacity: .8; text-shadow: 0 2px 8px #000; }
</style>
</head>
<body>
<div id="bg"></div>

<div id="brand">
  <img src="logo.png" alt="">
  <span>HELDORA <b>RP</b></span>
</div>

<div id="info"><em>INFO</em><span id="tip"></span></div>
<div id="status">Connexion au serveur...</div>
<div id="bar"></div>

<script>
  // ====== A MODIFIER ======
  var TIPS = [
    'Restez dans votre rôle en toutes circonstances.',
    'Respectez les règles du serveur et le staff.',
    'Le FearRP et le RDM sont interdits.',
    'Rejoignez notre Discord pour toute question.'
  ];
  // ========================

  var tip = document.getElementById('tip'), t = 0;

  // Astuces qui tournent
  function showTip() {
    tip.style.opacity = 0;
    setTimeout(function(){ tip.textContent = TIPS[t++ % TIPS.length]; tip.style.opacity = 1; }, 500);
  }
  showTip(); setInterval(showTip, 6000);

  // Fonctions appelées par GMod pendant le chargement
  function setProgress(p) { document.getElementById('bar').style.width = Math.min(100, p) + '%'; }
  var total = 0;
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {}
  function SetFilesTotal(x) { total = x; }
  function SetFilesNeeded(x) { if (total > 0) setProgress(((total - x) / total) * 100); }
  function SetStatusChanged(s) { document.getElementById('status').textContent = s; }
  // Hors du jeu (test navigateur) : fausse progression
  if (!window.gmod) { var f = 0; var iv = setInterval(function(){ f += 1.5; setProgress(f); if (f >= 100) clearInterval(iv); }, 120); }
</script>
</body>
</html>
